# Configuración para desplegar en Render (https://render.com) como "Blueprint".
# La base de datos está en Neon; su URL se pega a mano en DATABASE_URL.
services:
  - type: web
    name: ventas-mama
    runtime: node
    plan: free
    region: oregon
    branch: develop
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Fotos en Cloudflare R2 (se pegan a mano; ver .env.example).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_URL_PUBLICA
        sync: false
