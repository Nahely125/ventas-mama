
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Ventas Mamá</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background: #f3f7f4;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .login-icon {
            text-align: center;
            font-size: 42px;
            margin-bottom: 12px;
        }

        .login-card h1 {
            margin: 0 0 8px;
            text-align: center;
            color: #166534;
        }

        .login-subtitle {
            margin-bottom: 28px;
            text-align: center;
            color: #64748b;
        }

        .login-card label {
            display: block;
            margin: 16px 0 8px;
            font-weight: bold;
            color: #334155;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .login-card button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #15803d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-card button:hover {
            background: #166534;
        }

        #mensaje-login {
            margin-top: 16px;
            text-align: center;
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="login-icon">📦</div>

        <h1>Ventas Mamá</h1>

        <p class="login-subtitle">
            Ingresa tus credenciales para continuar
        </p>

        <form id="form-login">
            <label for="usuario">Usuario</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="btn-login">
                Iniciar sesión
            </button>

            <p id="mensaje-login" role="alert"></p>
        </form>
    </main>

    <script src="/login.js"></script>
</body>
</html>
