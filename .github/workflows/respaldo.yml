# Copia diaria de la base de datos (Neon) a Google Drive.
#
# Corre todos los días a las 3:00 a. m. (hora de Lima) y también se puede lanzar a mano desde
# GitHub → Actions → «Respaldo diario» → Run workflow. Guarda un archivo por día en la carpeta
# de Drive y borra los de más de 60 días.
#
# Necesita estos secretos (GitHub → Settings → Secrets and variables → Actions):
#   DATABASE_URL        la misma dirección de Neon que usa Render.
#   RCLONE_DRIVE_TOKEN  el permiso de Google Drive que da «rclone authorize "drive"» (el texto {...}).
# Y, si quieres otra carpeta, la variable (no secreto) DRIVE_CARPETA (por defecto «Respaldos Mil Deseos»).
#
# Para recuperar una copia: pg_restore --clean --if-exists --no-owner --dbname "DATABASE_URL" archivo.dump

name: Respaldo diario

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC = 3:00 a. m. en Lima
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRIVE_CARPETA: ${{ vars.DRIVE_CARPETA || 'Respaldos Mil Deseos' }}
      # rclone toma la configuración de Google Drive de estas variables (sin archivo de configuración).
      RCLONE_CONFIG_DRIVE_TYPE: drive
      RCLONE_CONFIG_DRIVE_SCOPE: drive
      RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}

    steps:
      - name: Revisar los secretos
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$RCLONE_CONFIG_DRIVE_TOKEN" ]; then
            echo "::error::Faltan los secretos DATABASE_URL o RCLONE_DRIVE_TOKEN."
            exit 1
          fi

      - name: Instalar pg_dump 18 y rclone
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 rclone > /dev/null
          pg_dump --version
          rclone version | head -n 1

      - name: Copiar la base de datos
        run: |
          set -euo pipefail
          ARCHIVO="ventas-mama-$(TZ=America/Lima date +%Y-%m-%d).dump"
          echo "ARCHIVO=$ARCHIVO" >> "$GITHUB_ENV"
          # Formato comprimido de PostgreSQL; sin dueños ni permisos para poder restaurarlo en otra base.
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file "$RUNNER_TEMP/$ARCHIVO"
          # Comprobar que la copia se puede leer (lista su contenido sin mostrar datos).
          /usr/lib/postgresql/18/bin/pg_restore --list "$RUNNER_TEMP/$ARCHIVO" > /dev/null
          ls -lh "$RUNNER_TEMP/$ARCHIVO" | awk '{print "Tamaño de la copia:", $5}'

      - name: Subir a Google Drive
        run: |
          set -euo pipefail
          rclone copyto "$RUNNER_TEMP/$ARCHIVO" "drive:$DRIVE_CARPETA/$ARCHIVO"
          # Se conservan los últimos 60 días.
          rclone delete "drive:$DRIVE_CARPETA" --min-age 60d --include "ventas-mama-*.dump"
          echo "Copia guardada en Drive: $DRIVE_CARPETA/$ARCHIVO"

      - name: Borrar la copia del servidor de GitHub
        if: always()
        run: rm -f "$RUNNER_TEMP"/ventas-mama-*.dump
